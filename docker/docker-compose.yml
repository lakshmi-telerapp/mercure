x-build: &build
  context: ${MERCURE_SRC:-..}
  args:
    VERSION_TAG: ${TAG:-latest}
    BASE_IMAGE_NAME: mercureimaging/mercure-base

x-env: &env
  environment:
    MERCURE_RUNNER: docker

x-docker-user: &docker-user
  user: "${UID:-1000}:${DOCKER_GID:-999}"

x-user: &user
  user: "${UID:-1000}:${GID:-1000}"

x-redis-env: &redis-env
  REDIS_URL: "redis://:${REDIS_PASSWORD:-mercure-redis-default-2026}@redis:6379/0"

networks:
  datastore:
    internal: true
  services:
    internal: true
  exposed:
  egress:

services:
  base:
    image: mercureimaging/mercure-base:${TAG:-latest}
    build:
      context: ${MERCURE_SRC:-..}
      dockerfile: docker/base/Dockerfile
    profiles:
      - build

  # Seed config into empty mounts (Coolify file storage / fresh hosts).
  # No-op when mercure.json already exists (normal install.sh setups).
  config_init:
    image: mercureimaging/mercure-base:${TAG:-latest}
    build:
      context: ${MERCURE_SRC:-..}
      dockerfile: docker/base/Dockerfile
      args:
        VERSION_TAG: ${TAG:-latest}
    user: "0:0"
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangePasswordHere}
      BOOKKEEPER_API_KEY: ${BOOKKEEPER_API_KEY:-mercure-bookkeeper-default-2026}
    volumes:
      - /opt/mercure/config:/opt/mercure/config
      - /opt/mercure/persistence:/opt/mercure/persistence
      - data:/opt/mercure/data
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /opt/mercure/config /opt/mercure/persistence \
          /opt/mercure/data/incoming /opt/mercure/data/studies /opt/mercure/data/outgoing \
          /opt/mercure/data/success /opt/mercure/data/error /opt/mercure/data/discard \
          /opt/mercure/data/processing /opt/mercure/data/jobs
        if [ ! -f /opt/mercure/config/mercure.json ]; then
          cp /opt/mercure/app/configuration/default_mercure.json /opt/mercure/config/mercure.json
        fi
        # Match install.sh docker setup: service DNS + real API key (placeholder refuses to boot).
        # Secrets are Compose-interpolated (no $$), same approach as redis --requirepass.
        sed -i "s|0.0.0.0:8080|bookkeeper:8080|" /opt/mercure/config/mercure.json
        sed -i "s|BOOKKEEPER_TOKEN_PLACEHOLDER|${BOOKKEEPER_API_KEY:-mercure-bookkeeper-default-2026}|" /opt/mercure/config/mercure.json
        [ -f /opt/mercure/config/services.json ] || cp /opt/mercure/app/configuration/default_services.json /opt/mercure/config/services.json
        if [ ! -f /opt/mercure/config/webgui.env ]; then
          cp /opt/mercure/app/configuration/default_webgui.env /opt/mercure/config/webgui.env
        fi
        sed -i "s|PutSomethingRandomHere|${BOOKKEEPER_API_KEY:-mercure-bookkeeper-default-2026}|" /opt/mercure/config/webgui.env
        if grep -q 'SECRET_KEY=PutSomethingRandomHere' /opt/mercure/config/webgui.env \
          || ! grep -q '^SECRET_KEY=.' /opt/mercure/config/webgui.env; then
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${BOOKKEEPER_API_KEY:-mercure-bookkeeper-default-2026}|" /opt/mercure/config/webgui.env
        fi
        if [ ! -f /opt/mercure/config/bookkeeper.env ]; then
          cp /opt/mercure/app/configuration/default_bookkeeper.env /opt/mercure/config/bookkeeper.env
        fi
        sed -i "s|mercure:ChangePasswordHere@localhost|mercure:${POSTGRES_PASSWORD:-ChangePasswordHere}@db|" /opt/mercure/config/bookkeeper.env
        sed -i "s|@localhost|@db|" /opt/mercure/config/bookkeeper.env
        printf 'POSTGRES_PASSWORD=%s\n' '${POSTGRES_PASSWORD:-ChangePasswordHere}' > /opt/mercure/config/db.env
        chmod -R a+rwX /opt/mercure/config /opt/mercure/persistence /opt/mercure/data
    networks:
      - services

  ui:
    <<: [*docker-user, *env]
    image: mercureimaging/mercure-ui${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/ui/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker_fast:
        condition: service_started
      worker_slow:
        condition: service_started
    environment:
      MERCURE_RUNNER: docker
      REDIS_URL: "redis://:${REDIS_PASSWORD:-mercure-redis-default-2026}@redis:6379/0"
    ports:
      - "8000:8000"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - exposed
      - datastore
      - services
      - egress

  db:
    image: library/postgres:14-alpine
    restart: always
    # Prefer Compose/Coolify env; optional host db.env for classic installs.
    env_file:
      - path: /opt/mercure/config/db.env
        required: false
    environment:
      POSTGRES_USER: mercure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangePasswordHere}
      POSTGRES_DB: mercure
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercure -d mercure"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - datastore

  receiver:
    <<: [*user, *env]
    image: mercureimaging/mercure-receiver${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/receiver/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      bookkeeper:
        condition: service_healthy
    ports:
      - "11112:11112"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - exposed
      - services

  cleaner:
    <<: [*user, *env]
    image: mercureimaging/mercure-cleaner${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/cleaner/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services

  dispatcher:
    <<: [*user, *env]
    image: mercureimaging/mercure-dispatcher${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/dispatcher/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services
      - egress

  processor:
    <<: [*docker-user, *env]
    image: mercureimaging/mercure-processor${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/processor/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
      - /opt/mercure/persistence:/opt/mercure/persistence
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - services
      - egress

  router:
    <<: [*user, *env]
    image: mercureimaging/mercure-router${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/router/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services

  bookkeeper:
    <<: [*user, *env]
    image: mercureimaging/mercure-bookkeeper${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/bookkeeper/Dockerfile
    restart: always
    depends_on:
      config_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      MERCURE_RUNNER: docker
      DATABASE_URL: "postgresql://mercure:${POSTGRES_PASSWORD:-ChangePasswordHere}@db:5432/mercure"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore
      - services

  redis:
    image: redis:7-alpine
    restart: always
    # Use Compose ${...} interpolation so requirepass is always set ($$ shell
    # escaping can expand empty under Coolify and leave Redis unauthenticated).
    command:
      - redis-server
      - --save
      - "20"
      - "1"
      - --requirepass
      - ${REDIS_PASSWORD:-mercure-redis-default-2026}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-mercure-redis-default-2026}"
    volumes:
      - redis-cache:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - ${REDIS_PASSWORD:-mercure-redis-default-2026}
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - datastore

  worker_fast:
    <<: *user
    image: mercureimaging/mercure-worker${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/worker/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WORKER_QUEUE: mercure_fast
      REDIS_URL: "redis://:${REDIS_PASSWORD:-mercure-redis-default-2026}@redis:6379/0"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore

  worker_slow:
    <<: *user
    image: mercureimaging/mercure-worker${IMAGE_TAG:-:latest}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WORKER_QUEUE: mercure_slow
      REDIS_URL: "redis://:${REDIS_PASSWORD:-mercure-redis-default-2026}@redis:6379/0"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore

volumes:
  db-data:
  data:
  redis-cache:
