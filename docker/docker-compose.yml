
x-build: &build
  context: ${MERCURE_SRC:-..}
  args:
    VERSION_TAG: ${TAG:-latest}
    BASE_IMAGE_NAME: mercureimaging/mercure-base

x-env: &env
  environment:
    MERCURE_RUNNER: docker

x-docker-user: &docker-user
  user: "${UID:-1000}:${DOCKER_GID:-999}"

x-user: &user
  user: "${UID:-1000}:${GID:-1000}"

networks:
  datastore:
    internal: true
  services:
    internal: true
  exposed:
  egress:

services:
  base:
    image: mercureimaging/mercure-base:${TAG:-latest}
    build:
      context: ${MERCURE_SRC:-..}
      dockerfile: docker/base/Dockerfile
    profiles: ["build"]

  ui:
    <<: [*docker-user, *env]
    image: mercureimaging/mercure-ui${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/ui/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      worker_fast:
        condition: service_started
      worker_slow:
        condition: service_started
    environment:
      MERCURE_RUNNER: docker
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in environment}@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - exposed
      - datastore
      - services
      - egress

  db:
    image: library/postgres:14-alpine
    restart: always
    env_file:
      - /opt/mercure/config/db.env
    environment:
      POSTGRES_USER: mercure
      POSTGRES_DB: mercure
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercure"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datastore

  receiver:
    <<: [*user, *env]
    image: mercureimaging/mercure-receiver${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/receiver/Dockerfile
    restart: always
    depends_on:
      bookkeeper:
        condition: service_healthy
    ports:
      - "11112:11112"
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - exposed
      - services

  cleaner:
    <<: [*user, *env]
    image: mercureimaging/mercure-cleaner${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/cleaner/Dockerfile
    restart: always
    depends_on:
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services

  dispatcher:
    <<: [*user, *env]
    image: mercureimaging/mercure-dispatcher${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/dispatcher/Dockerfile
    restart: always
    depends_on:
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services
      - egress

  processor:
    <<: [*docker-user, *env]
    image: mercureimaging/mercure-processor${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/processor/Dockerfile
    restart: always
    depends_on:
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
      - /opt/mercure/persistence:/opt/mercure/persistence
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - services
      - egress

  router:
    <<: [*user, *env]
    image: mercureimaging/mercure-router${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/router/Dockerfile
    restart: always
    depends_on:
      bookkeeper:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - services

  bookkeeper:
    <<: [*user, *env]
    image: mercureimaging/mercure-bookkeeper${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/bookkeeper/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore
      - services

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" || { echo "ERROR: REDIS_PASSWORD is not set"; exit 1; } && exec redis-server --save 20 1 --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in environment}
    volumes:
      - redis-cache:/data
    networks:
      - datastore

  worker_fast:
    <<: *user
    image: mercureimaging/mercure-worker${IMAGE_TAG:-:latest}
    build:
      <<: *build
      dockerfile: docker/worker/Dockerfile
    restart: always
    depends_on:
      - redis
    environment:
      WORKER_QUEUE: mercure_fast
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in environment}@redis:6379/0
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore

  worker_slow:
    <<: *user
    image: mercureimaging/mercure-worker${IMAGE_TAG:-:latest}
    restart: always
    depends_on:
      - redis
    environment:
      WORKER_QUEUE: mercure_slow
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in environment}@redis:6379/0
    volumes:
      - data:/opt/mercure/data
      - /opt/mercure/config:/opt/mercure/config:ro
    networks:
      - datastore

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/mercure/db

  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/mercure/data

  redis-cache:
    driver: local
